name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pinned to an exact clang-format: the tool's output changes between releases,
  # so an unpinned check would start failing on code nobody touched. Only the
  # engine's own sources are checked; third_party/ is upstream code and is not
  # ours to reformat. No submodules for the same reason.
  format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      - name: Check formatting
        run: >
          find src tests
          \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.c' \)
          -print0 | xargs -0 clang-format --dry-run -Werror

  build:
    # graphics=OFF is not redundant: it is what keeps "the core needs no GPU and
    # no graphics dependencies" a tested claim rather than an aspiration.
    # Windows is here because the README promises MSVC support and the MSVC
    # warning set in cmake/YsqWarnings.cmake is otherwise never compiled.
    name: ${{ matrix.os }} / graphics=${{ matrix.graphics }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Quoted: YAML 1.1 reads bare ON/OFF as booleans, which would break the
        # `matrix.graphics == 'ON'` comparison below and skip the X11 install.
        graphics: ["ON", "OFF"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # GLFW 3.4 builds both the X11 and Wayland backends on Linux by default.
      # xorg-dev covers X11; Wayland additionally needs the wayland-scanner
      # binary (libwayland-bin) plus the wayland-client and xkbcommon headers.
      # The Wayland protocol XMLs are vendored in glfw/deps/wayland, so the
      # wayland-protocols package is not required.
      #
      # libosmesa6 is a runtime dependency, not a build one: GLFW's Null
      # backend dlopens it to create an OpenGL context with no display at all.
      # This is the only runner where a context is guaranteed, which is why
      # YSQ_REQUIRE_HEADLESS_GL is set below for exactly this job.
      - name: Install GLFW build dependencies
        if: runner.os == 'Linux' && matrix.graphics == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libwayland-bin libxkbcommon-dev
          sudo apt-get install -y libosmesa6

      # YSQ_REQUIRE_HEADLESS_GL is on for exactly one job. Whether an OpenGL
      # context can exist is a property of the machine, so the context test
      # falls back to the Null backend and skips if even that yields nothing.
      # Only this runner has OSMesa, so only here is the headless context a
      # promise rather than a hope; without it the file could skip on all six
      # jobs and quietly stop testing anything.
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DYSQ_BUILD_GRAPHICS=${{ matrix.graphics }}
          -DYSQ_WARNINGS_AS_ERRORS=ON
          -DYSQ_REQUIRE_HEADLESS_GL=${{ (runner.os == 'Linux' && matrix.graphics == 'ON') && 'ON' || 'OFF' }}

      # --config is required by the multi-config Visual Studio generator, which
      # otherwise ignores CMAKE_BUILD_TYPE and builds Debug. It is a no-op for
      # the single-config generators used on Linux and macOS.
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      # Everything here is CPU-only and needs no display, so the runners need no
      # GPU and no virtual framebuffer. The one test that wants an OpenGL
      # context gets one without a display too; see the Configure step.
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
